        model: "hr.employee"
        save_as: "employee"
        as_user: "base.user_admin"
        values:
          name: "Status Check Employee 3"

      - step: "Create status check item"
        action: "create"
        model: "status.check.item"
        save_as: "item"
        as_user: "base.user_admin"
        values:
          name: "Status Check Item 3"
          code: "SCITEM3"
          status_check_method: "use_python"
          python_code: "result = False"

      - step: "Create status check template matching only this expense type"
        action: "create"
        model: "status.check.template"
        save_as: "template"
        as_user: "base.user_admin"
        values:
          name: "Status Check Template 3"
          model_id: "REC: model_reimbursement.id"
          python_code: "result = document.type_id.code == 'SCTYPE3'"

      - step: "Create status check template detail"
        action: "create"
        model: "status.check.template_detail"
        save_as: "template_detail"
        as_user: "base.user_admin"
        values:
          template_id: "REC: template.id"
          status_check_item_id: "REC: item.id"

      - step: "Create state change constrain template"
        action: "create"
        model: "state.change.constrain.template"
        save_as: "constrain_template"
        as_user: "base.user_admin"
        values:
          name: "State Constrain Template 3"
          model_id: "REC: model_reimbursement.id"
          state_field_id: "REC: state_field.id"
          status_check_template_id: "REC: template.id"
          python_code: "result = True"

      - step: "Require the item before the document can reach confirm"
        action: "create"
        model: "state.change.constrain.template_detail"
        save_as: "constrain_detail"
        as_user: "base.user_admin"
        values:
          template_id: "REC: constrain_template.id"
          state_id: "REC: state_confirm.id"
          status_check_item_ids:
            - - 6
              - 0
              - - "REC: item.id"

      - step: "Create draft reimbursement"
        action: "create"
        model: "hr.reimbursement"
        save_as: "reimbursement"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          type_id: "REC: expense_type.id"
          journal_id: "REC: journal.id"
          account_id: "REC: account.id"
          date: 2026-02-01
          date_due: 2026-03-01

      - step: "Force a fresh read so the status check lines are visible (T-04)"
        action: "assert"
        target: "reimbursement"
        refresh: true
        asserts:
          state_change_constrain_template_id:
            type: "m2o"
            expected: "REC: constrain_template"
          status_check_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

      - step: "Confirm is blocked by the failing status check item"
        action: "call"
        target: "reimbursement"
        method: "action_confirm"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "Status Check Item 3"

