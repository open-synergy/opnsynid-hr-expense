options:
  auto_refresh: true

scenarios:
  - name:
      "Onchange type_id cascades to journal_id/account_id/line usage/line analytic
      account"
    steps:
      - step: "Get payable account type (system data)"
        action: "ref"
        xml_id: "account.data_account_type_payable"
        save_as: "account_type_payable"

      - step: "Create reimbursement account"
        action: "create"
        model: "account.account"
        save_as: "account"
        as_user: "base.user_admin"
        values:
          name: "Onchange Reimb Account"
          code: "OCAC1ACC"
          user_type_id: "REC: account_type_payable.id"
          internal_type: "other"
          reconcile: true

      - step: "Create reimbursement journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        as_user: "base.user_admin"
        values:
          name: "Onchange Reimb Journal"
          code: "OCJ1"
          type: "general"

      - step: "Create default product usage for the line"
        action: "create"
        model: "product.usage_type"
        save_as: "usage_type"
        as_user: "base.user_admin"
        values:
          name: "Onchange Reimb Usage"
          code: "OCUSAGE1"

      - step: "Create expense type wired with journal/account/usage"
        action: "create"
        model: "hr.expense_type"
        save_as: "expense_type"
        as_user: "base.user_admin"
        values:
          name: "Onchange Reimb Type"
          code: "OCTYPE1"
          reimbursement_journal_id: "REC: journal.id"
          reimbursement_account_id: "REC: account.id"
          default_product_usage_id: "REC: usage_type.id"

      - step: "Create an analytic account to prove the line reset"
        # No `as_user:` here (unlike the other fixtures in this scenario):
        # creating account.analytic.account requires the
        # analytic.group_analytic_accounting group, which base.user_admin
        # does not carry by default. Omitting `as_user:` runs this step
        # in the transaction's own (superuser) environment instead.
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic_account"
        values:
          name: "Onchange Reimb Analytic Account"

      - step: "Create a product for the inline detail line"
        action: "create"
        model: "product.product"
        save_as: "product"
        as_user: "base.user_admin"
        values:
          name: "Onchange Reimb Product"
          type: "consu"

      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        as_user: "base.user_admin"
        values:
          name: "Onchange Reimb Employee"

      - step: "Fill header with a pre-filled line, then toggle type_id"
        action: form
        model: "hr.reimbursement"
        save_as: "header"
        as_user: "base.user_admin"
        ops:
          - set: {employee_id: "REC: employee"}
          - set: {date: 2026-03-02}
          - set: {date_due: 2026-03-05}
          - new:
              field: "line_ids"
              values:
                product_id: "REC: product"
                name: "Onchange Reimb Line"
                uom_id: "REC: product.uom_id"
                uom_quantity: 1
                price_unit: 10.0
                account_id: "REC: account"
                analytic_account_id: "REC: analytic_account"
          - set: {type_id: "REC: expense_type"}
          - assert:
              journal_id:
                type: "m2o"
                expected: "REC: journal"
              account_id:
                type: "m2o"
                expected: "REC: account"
          # `action: form` requires many2one values to be records, and the
          # Form API itself rejects a bare `False` for a many2one (it only
          # accepts a recordset). An empty recordset of the right model
          # clears the field the same way the UI would.
          - set: {type_id: "EVAL: env['hr.expense_type']"}
          - assert:
              journal_id:
                type: "value"
                operator: "is_falsy"
              account_id:
                type: "value"
                operator: "is_falsy"
          # type_id is required to save the record -- set it back so the
          # form can be saved and the resulting line inspected below.
          - set: {type_id: "REC: expense_type"}
        save: true

      - step: "Assert line usage_id populated from type_id.default_product_usage_id"
        action: "assert"
        target: "header"
        refresh: true
        asserts:
          line_ids.usage_id:
            type: "m2o"
            expected: "REC: usage_type"

      - step:
          "Assert line analytic_account_id reset by onchange_line_analytic_account_id"
        action: "assert"
        target: "header"
        refresh: true
        asserts:
          line_ids.analytic_account_id:
            type: "value"
            operator: "is_falsy"

  - name: "Onchange employee_id/type_id resets pricelist_id"
    steps:
      - step: "Create expense type (default domain pricelist selection)"
        action: "create"
        model: "hr.expense_type"
        save_as: "expense_type_pl"
        as_user: "base.user_admin"
        values:
          name: "Onchange Reimb PL Type"
          code: "OCTYPE2"

      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee_pl1"
        as_user: "base.user_admin"
        values:
          name: "Onchange Reimb PL Employee 1"

      - step: "Create a second employee to trigger the reset"
        action: "create"
        model: "hr.employee"
        save_as: "employee_pl2"
        as_user: "base.user_admin"
        values:
          name: "Onchange Reimb PL Employee 2"

      - step:
          "Create a pricelist (defaults to the current company currency, same as the
          document's default currency_id)"
        # No `as_user:` here: creating product.pricelist requires
        # base.group_partner_manager or base.group_system, which is not
        # guaranteed on base.user_admin. Omitting `as_user:` runs this
        # step in the transaction's own (superuser) environment instead.
        action: "create"
        model: "product.pricelist"
        save_as: "pricelist"
        values:
          name: "Onchange Reimb Pricelist"

      - step: "Set pricelist_id, then change employee_id to trigger the reset"
        action: form
        model: "hr.reimbursement"
        save: false
        as_user: "base.user_admin"
        ops:
          - set: {employee_id: "REC: employee_pl1"}
          - set: {type_id: "REC: expense_type_pl"}
          - set: {pricelist_id: "REC: pricelist"}
          - assert:
              pricelist_id:
                type: "m2o"
                expected: "REC: pricelist"
          - set: {employee_id: "REC: employee_pl2"}
          - assert:
              pricelist_id:
                type: "value"
                operator: "is_falsy"

  - name: "Onchange date_due follows duration_id.get_duration(date)"
    steps:
      - step: "Create a 30-day duration"
        action: "create"
        model: "base.duration"
        save_as: "duration"
        as_user: "base.user_admin"
        values:
          name: "Onchange Reimb Duration 30 Days"
          code: "OCDUR30"
          relative_delta_days: 30

      - step: "Set date, assert date_due still empty (no duration yet)"
        action: form
        model: "hr.reimbursement"
        save: false
        as_user: "base.user_admin"
        ops:
          - set: {date: 2026-04-10}
          - assert:
              date_due:
                type: "value"
                operator: "is_falsy"
          - set: {duration_id: "REC: duration"}
          - assert:
              date_due:
                type: "value"
                expected: 2026-05-10
          - set: {date: 2026-04-20}
          - assert:
              date_due:
                type: "value"
                expected: 2026-05-20
