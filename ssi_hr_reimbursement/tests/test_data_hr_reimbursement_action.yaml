options:
  auto_refresh: true

scenarios:
  - name:
      "Action Open -- confirm then action_open transitions to Open and posts accounting
      entry"
    steps:
      - step: "Get payable account type (system data)"
        action: "ref"
        xml_id: "account.data_account_type_payable"
        save_as: "account_type_payable"

      - step: "Create reimbursement account"
        action: "create"
        model: "account.account"
        save_as: "account"
        as_user: "base.user_admin"
        values:
          name: "Action Open Reimb Account"
          code: "ACOP1ACC"
          user_type_id: "REC: account_type_payable.id"
          internal_type: "other"
          reconcile: true

      - step: "Create reimbursement journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        as_user: "base.user_admin"
        values:
          name: "Action Open Reimb Journal"
          code: "AOJ1"
          type: "general"

      - step: "Create expense type"
        action: "create"
        model: "hr.expense_type"
        save_as: "expense_type"
        as_user: "base.user_admin"
        values:
          name: "Action Open Reimb Type"
          code: "ACOP1TYPE"

      - step: "Create home address partner for the employee"
        action: "create"
        model: "res.partner"
        save_as: "employee_partner"
        as_user: "base.user_admin"
        values:
          name: "Action Open Employee Address"
          is_company: false

      - step:
          "Create employee with a home address (required by _get_partner_id on open)"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        as_user: "base.user_admin"
        values:
          name: "Action Open Employee"
          address_home_id: "REC: employee_partner.id"

      - step: "Create draft reimbursement"
        action: "create"
        model: "hr.reimbursement"
        save_as: "reimbursement"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          type_id: "REC: expense_type.id"
          journal_id: "REC: journal.id"
          account_id: "REC: account.id"
          date: 2026-02-01
          date_due: 2026-03-01

      - step: "Assert created in draft"
        action: "assert"
        target: "reimbursement"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm reimbursement (prerequisite for Open)"
        action: "call"
        target: "reimbursement"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Force a fresh read before calling action_open directly (T-04)"
        action: "assert"
        target: "reimbursement"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step:
          "Call action_open directly: transitions to Open and creates the journal entry"
        action: "call"
        target: "reimbursement"
        method: "action_open"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert accounting entry linked and not yet reconciled"
        action: "assert"
        target: "reimbursement"
        refresh: true
        asserts:
          move_id:
            type: "value"
            operator: "is_truthy"
          payable_move_line_id:
            type: "value"
            operator: "is_truthy"
          reconciled:
            type: "value"
            expected: false

  - name:
      "Action Cancel -- draft reimbursement cancelled through the select-reason wizard
      (exercises action_cancel)"
    steps:
      - step: "Get payable account type (system data)"
        action: "ref"
        xml_id: "account.data_account_type_payable"
        save_as: "account_type_payable_cancel"

      - step: "Create reimbursement account for the cancel fixture"
        action: "create"
        model: "account.account"
        save_as: "account_cancel"
        as_user: "base.user_admin"
        values:
          name: "Action Cancel Reimb Account"
          code: "ACCN1ACC"
          user_type_id: "REC: account_type_payable_cancel.id"
          internal_type: "other"
          reconcile: true

      - step: "Create journal for the cancel fixture"
        action: "create"
        model: "account.journal"
        save_as: "journal_cancel"
        as_user: "base.user_admin"
        values:
          name: "Action Cancel Reimb Journal"
          code: "ACJ1"
          type: "general"

      - step: "Create expense type for the cancel fixture"
        action: "create"
        model: "hr.expense_type"
        save_as: "expense_type_cancel"
        as_user: "base.user_admin"
        values:
          name: "Action Cancel Reimb Type"
          code: "ACCN1TYPE"

      - step: "Create employee for the cancel fixture"
        action: "create"
        model: "hr.employee"
        save_as: "employee_cancel"
        as_user: "base.user_admin"
        values:
          name: "Action Cancel Employee"

      - step:
          "Create draft reimbursement (no move yet, so cancel needs no accounting
          cleanup)"
        action: "create"
        model: "hr.reimbursement"
        save_as: "reimbursement_cancel"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee_cancel.id"
          type_id: "REC: expense_type_cancel.id"
          journal_id: "REC: journal_cancel.id"
          account_id: "REC: account_cancel.id"
          date: 2026-02-01
          date_due: 2026-03-01

      - step: "Create a global cancel reason"
        action: "create"
        model: "base.cancel_reason"
        save_as: "cancel_reason"
        as_user: "base.user_admin"
        values:
          name: "Action Cancel Reimb Reason"
          code: "ACCN1REASON"
          global_use: true

      - step: "Cancel via select-reason wizard (exercises action_cancel)"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "reimbursement_cancel"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: cancel_reason"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"

  - name: "Action Recompute Realization -- no-op, then Open<->Done as reconciled flips"
    steps:
      - step: "Get payable account type (system data)"
        action: "ref"
        xml_id: "account.data_account_type_payable"
        save_as: "account_type_payable_recompute"

      - step: "Create reimbursement account for the recompute fixture"
        action: "create"
        model: "account.account"
        save_as: "account_recompute"
        as_user: "base.user_admin"
        values:
          name: "Action Recompute Reimb Account"
          code: "ACRC1ACC"
          user_type_id: "REC: account_type_payable_recompute.id"
          internal_type: "other"
          reconcile: true

      - step: "Create journal for the recompute fixture"
        action: "create"
        model: "account.journal"
        save_as: "journal_recompute"
        as_user: "base.user_admin"
        values:
          name: "Action Recompute Reimb Journal"
          code: "ARJ1"
          type: "general"

      - step: "Create expense type for the recompute fixture"
        action: "create"
        model: "hr.expense_type"
        save_as: "expense_type_recompute"
        as_user: "base.user_admin"
        values:
          name: "Action Recompute Reimb Type"
          code: "ACRC1TYPE"

      - step: "Create home address partner"
        action: "create"
        model: "res.partner"
        save_as: "employee_partner_recompute"
        as_user: "base.user_admin"
        values:
          name: "Action Recompute Employee Address"
          is_company: false

      - step: "Create employee with a home address"
        action: "create"
        model: "hr.employee"
        save_as: "employee_recompute"
        as_user: "base.user_admin"
        values:
          name: "Action Recompute Employee"
          address_home_id: "REC: employee_partner_recompute.id"

      - step: "Create, confirm and open the reimbursement"
        action: "create"
        model: "hr.reimbursement"
        save_as: "reimbursement_recompute"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee_recompute.id"
          type_id: "REC: expense_type_recompute.id"
          journal_id: "REC: journal_recompute.id"
          account_id: "REC: account_recompute.id"
          date: 2026-02-01
          date_due: 2026-03-01

      - step: "Confirm"
        action: "call"
        target: "reimbursement_recompute"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Force a fresh read before opening (T-04)"
        action: "assert"
        target: "reimbursement_recompute"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Open (creates the accounting entry, not yet reconciled)"
        action: "call"
        target: "reimbursement_recompute"
        method: "action_open"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "action_recompute_realization is a no-op while not reconciled"
        action: "call"
        target: "reimbursement_recompute"
        method: "action_recompute_realization"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Simulate full reconciliation by writing the stored flag"
        action: "write"
        target: "reimbursement_recompute"
        as_user: "base.user_admin"
        values:
          reconciled: true

      - step: "action_recompute_realization moves a reconciled Open document to Done"
        action: "call"
        target: "reimbursement_recompute"
        method: "action_recompute_realization"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Simulate the payable line becoming unreconciled again"
        action: "write"
        target: "reimbursement_recompute"
        as_user: "base.user_admin"
        values:
          reconciled: false

      - step:
          "action_recompute_realization reopens a Done document that is no longer
          reconciled"
        action: "call"
        target: "reimbursement_recompute"
        method: "action_recompute_realization"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
