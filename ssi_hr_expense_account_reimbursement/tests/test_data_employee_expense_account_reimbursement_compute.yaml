options:
  auto_refresh: true

scenarios:
  - name:
      "_compute_reimbursement and _compute_valid_reimbursement_line_ids track the linked
      reimbursement lines"
    steps:
      - step: "Create expense account type"
        action: "create"
        model: "employee_expense_account_type"
        save_as: "ea_type"
        as_user: "base.user_admin"
        values:
          name: "Reimbursement Compute Expense Type"
          code: "/"

      - step: "Create currency"
        action: "create"
        model: "res.currency"
        save_as: "currency"
        as_user: "base.user_admin"
        values:
          name: "RBC"
          symbol: "R$"

      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        as_user: "base.user_admin"
        values:
          name: "Reimbursement Compute Employee"

      - step: "Create expense account"
        action: "create"
        model: "employee_expense_account"
        save_as: "expense_account"
        as_user: "base.user_admin"
        values:
          type_id: "REC: ea_type.id"
          currency_id: "REC: currency.id"
          employee_id: "REC: employee.id"
          date_start: 2026-01-01
          date_end: 2026-12-31
          amount_limit: 1000.0

      - step:
          "Assert both compute fields start empty before any reimbursement line is
          linked"
        action: "assert"
        target: "expense_account"
        refresh: true
        asserts:
          amount_reimbursement:
            type: "value"
            expected: 0.0
          valid_reimbursement_line_ids:
            type: "o2m"
            check: "count"
            expected_count: 0

      - step: "Get payable account type (system data)"
        action: "ref"
        xml_id: "account.data_account_type_payable"
        save_as: "account_type_payable"

      - step: "Create reimbursement account"
        action: "create"
        model: "account.account"
        save_as: "reimb_account"
        as_user: "base.user_admin"
        values:
          name: "Reimbursement Compute Account"
          code: "RBC1ACC"
          user_type_id: "REC: account_type_payable.id"
          internal_type: "other"
          reconcile: true

      - step: "Create the line's expense account (accounting)"
        action: "create"
        model: "account.account"
        save_as: "line_account"
        as_user: "base.user_admin"
        values:
          name: "Reimbursement Compute Line Account"
          code: "RBC1LNACC"
          user_type_id: "REC: account_type_payable.id"
          internal_type: "other"
          reconcile: true

      - step: "Create reimbursement journal"
        action: "create"
        model: "account.journal"
        save_as: "reimb_journal"
        as_user: "base.user_admin"
        values:
          name: "Reimbursement Compute Journal"
          code: "RBCJ1"
          type: "general"

      - step: "Create expense type for the reimbursement"
        action: "create"
        model: "hr.expense_type"
        save_as: "hr_type"
        as_user: "base.user_admin"
        values:
          name: "Reimbursement Compute Type"
          code: "RBCTYPE"

      - step: "Create a product for the reimbursement line"
        action: "create"
        model: "product.product"
        save_as: "product"
        as_user: "base.user_admin"
        values:
          name: "Reimbursement Compute Product"
          type: "consu"

      - step: "Create the (draft) reimbursement that will later be cancelled"
        action: "create"
        model: "hr.reimbursement"
        save_as: "reimbursement"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          type_id: "REC: hr_type.id"
          journal_id: "REC: reimb_journal.id"
          account_id: "REC: reimb_account.id"
          date: 2026-02-10
          date_due: 2026-03-10

      - step: "Create the reimbursement line linked to the expense account"
        action: "create"
        model: "hr.reimbursement_line"
        save_as: "line"
        as_user: "base.user_admin"
        values:
          reimbursement_id: "REC: reimbursement.id"
          expense_account_id: "REC: expense_account.id"
          product_id: "REC: product.id"
          name: "Reimbursement Compute Line"
          date_expense: 2026-02-10
          uom_id: "REC: product.uom_id.id"
          uom_quantity: 1.0
          price_unit: 100.0
          account_id: "REC: line_account.id"

      - step:
          "Assert both compute fields include the still-relevant draft reimbursement
          line"
        action: "assert"
        target: "expense_account"
        refresh: true
        asserts:
          amount_reimbursement:
            type: "value"
            expected: 100.0
          valid_reimbursement_line_ids:
            type: "o2m"
            check: "exact"
            expected_records:
              - "REC: line"

      - step: "Create a global cancel reason"
        action: "create"
        model: "base.cancel_reason"
        save_as: "cancel_reason"
        as_user: "base.user_admin"
        values:
          name: "Reimbursement Compute Cancel Reason"
          code: "RBCREASON"
          global_use: true

      - step: "Cancel the reimbursement via the select-reason wizard"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "reimbursement"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: cancel_reason"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step:
          "Assert both compute fields drop the line once its reimbursement reaches a
          dead-end state (cancel)"
        action: "assert"
        target: "expense_account"
        refresh: true
        asserts:
          amount_reimbursement:
            type: "value"
            expected: 0.0
          valid_reimbursement_line_ids:
            type: "o2m"
            check: "count"
            expected_count: 0
