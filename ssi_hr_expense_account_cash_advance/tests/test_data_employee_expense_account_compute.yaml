options:
  auto_refresh: true

scenarios:
  - name:
      "_compute_cash_advance and _compute_valid_cash_advance_settlement_line_ids track
      the linked settlement lines"
    steps:
      - step: "Create expense account type"
        action: "create"
        model: "employee_expense_account_type"
        save_as: "ea_type"
        as_user: "base.user_admin"
        values:
          name: "Cash Advance Compute Expense Type"
          code: "/"

      - step: "Create currency"
        action: "create"
        model: "res.currency"
        save_as: "currency"
        as_user: "base.user_admin"
        values:
          name: "CAC"
          symbol: "C$"

      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        as_user: "base.user_admin"
        values:
          name: "Cash Advance Compute Employee"

      - step: "Create expense account"
        action: "create"
        model: "employee_expense_account"
        save_as: "expense_account"
        as_user: "base.user_admin"
        values:
          type_id: "REC: ea_type.id"
          currency_id: "REC: currency.id"
          employee_id: "REC: employee.id"
          date_start: 2026-01-01
          date_end: 2026-12-31
          amount_limit: 1000.0

      - step:
          "Assert both compute fields start empty before any settlement line is linked"
        action: "assert"
        target: "expense_account"
        refresh: true
        asserts:
          amount_cash_advance:
            type: "value"
            expected: 0.0
          valid_cash_advance_settlement_line_ids:
            type: "o2m"
            check: "count"
            expected_count: 0

      - step: "Get payable account type (system data)"
        action: "ref"
        xml_id: "account.data_account_type_payable"
        save_as: "account_type_payable"

      - step: "Create cash advance account"
        action: "create"
        model: "account.account"
        save_as: "cash_advance_account"
        as_user: "base.user_admin"
        values:
          name: "Cash Advance Compute CA Advance Account"
          code: "CACCA1"
          user_type_id: "REC: account_type_payable.id"
          internal_type: "other"
          reconcile: true

      - step: "Create payable account"
        action: "create"
        model: "account.account"
        save_as: "payable_account"
        as_user: "base.user_admin"
        values:
          name: "Cash Advance Compute CA Payable Account"
          code: "CACPAY1"
          user_type_id: "REC: account_type_payable.id"
          internal_type: "other"
          reconcile: true

      - step: "Create the settlement line's expense account (accounting)"
        action: "create"
        model: "account.account"
        save_as: "line_account"
        as_user: "base.user_admin"
        values:
          name: "Cash Advance Compute Line Account"
          code: "CACLN1"
          user_type_id: "REC: account_type_payable.id"
          internal_type: "other"
          reconcile: true

      - step: "Create cash advance journal"
        action: "create"
        model: "account.journal"
        save_as: "ca_journal"
        as_user: "base.user_admin"
        values:
          name: "Cash Advance Compute CA Journal"
          code: "CACJ1"
          type: "general"

      - step: "Create settlement journal"
        action: "create"
        model: "account.journal"
        save_as: "settlement_journal"
        as_user: "base.user_admin"
        values:
          name: "Cash Advance Compute Settlement Journal"
          code: "CACJ2"
          type: "general"

      - step: "Create expense type for the cash advance/settlement"
        action: "create"
        model: "hr.expense_type"
        save_as: "hr_type"
        as_user: "base.user_admin"
        values:
          name: "Cash Advance Compute Type"
          code: "CACTYPE"

      - step: "Create the underlying (draft) cash advance"
        action: "create"
        model: "hr.cash_advance"
        save_as: "cash_advance"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          type_id: "REC: hr_type.id"
          journal_id: "REC: ca_journal.id"
          cash_advance_account_id: "REC: cash_advance_account.id"
          payable_account_id: "REC: payable_account.id"
          date: 2026-02-01
          date_due: 2026-03-01

      - step: "Create the (draft) settlement that will later be cancelled"
        action: "create"
        model: "hr.cash_advance_settlement"
        save_as: "settlement"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          type_id: "REC: hr_type.id"
          cash_advance_id: "REC: cash_advance.id"
          journal_id: "REC: settlement_journal.id"
          date: 2026-02-10

      - step: "Create a product for the settlement line"
        action: "create"
        model: "product.product"
        save_as: "product"
        as_user: "base.user_admin"
        values:
          name: "Cash Advance Compute Product"
          type: "consu"

      - step: "Create the settlement line linked to the expense account"
        action: "create"
        model: "hr.cash_advance_settlement_line"
        save_as: "line"
        as_user: "base.user_admin"
        values:
          cash_advance_settlement_id: "REC: settlement.id"
          expense_account_id: "REC: expense_account.id"
          product_id: "REC: product.id"
          name: "Cash Advance Compute Line"
          date_expense: 2026-02-10
          uom_id: "REC: product.uom_id.id"
          uom_quantity: 1.0
          price_unit: 100.0
          account_id: "REC: line_account.id"

      - step:
          "Assert both compute fields include the still-relevant draft settlement line"
        action: "assert"
        target: "expense_account"
        refresh: true
        asserts:
          amount_cash_advance:
            type: "value"
            expected: 100.0
          valid_cash_advance_settlement_line_ids:
            type: "o2m"
            check: "exact"
            expected_records:
              - "REC: line"

      - step: "Create a global cancel reason"
        action: "create"
        model: "base.cancel_reason"
        save_as: "cancel_reason"
        as_user: "base.user_admin"
        values:
          name: "Cash Advance Compute Cancel Reason"
          code: "CACREASON"
          global_use: true

      - step: "Cancel the settlement via the select-reason wizard"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "settlement"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: cancel_reason"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step:
          "Assert both compute fields drop the line once its settlement reaches a
          dead-end state (cancel)"
        action: "assert"
        target: "expense_account"
        refresh: true
        asserts:
          amount_cash_advance:
            type: "value"
            expected: 0.0
          valid_cash_advance_settlement_line_ids:
            type: "o2m"
            check: "count"
            expected_count: 0
