options:
  auto_refresh: true

scenarios:
  - name:
      "Onchange type_id cascades to settlement journal/pricelist/line usage/line
      analytic"
    steps:
      - step: "Get payable account type (system data)"
        action: "ref"
        xml_id: "account.data_account_type_payable"
        save_as: "account_type_payable"

      - step: "Create cash advance account (for the underlying cash advance)"
        action: "create"
        model: "account.account"
        save_as: "cash_advance_account"
        as_user: "base.user_admin"
        values:
          name: "Settlement Onchange CA Advance Account"
          code: "STOC1ADV"
          user_type_id: "REC: account_type_payable.id"
          internal_type: "other"
          reconcile: true

      - step: "Create payable account (for the underlying cash advance)"
        action: "create"
        model: "account.account"
        save_as: "payable_account"
        as_user: "base.user_admin"
        values:
          name: "Settlement Onchange CA Payable Account"
          code: "STOC1PAY"
          user_type_id: "REC: account_type_payable.id"
          internal_type: "other"
          reconcile: true

      - step: "Create the line's expense account"
        action: "create"
        model: "account.account"
        save_as: "line_account"
        as_user: "base.user_admin"
        values:
          name: "Settlement Onchange Line Account"
          code: "STOC1LN"
          user_type_id: "REC: account_type_payable.id"
          internal_type: "other"
          reconcile: true

      - step: "Create cash advance journal"
        action: "create"
        model: "account.journal"
        save_as: "ca_journal"
        as_user: "base.user_admin"
        values:
          name: "Settlement Onchange CA Journal"
          code: "STOJ1"
          type: "general"

      - step: "Create settlement journal"
        action: "create"
        model: "account.journal"
        save_as: "settlement_journal"
        as_user: "base.user_admin"
        values:
          name: "Settlement Onchange Journal"
          code: "STOJ2"
          type: "general"

      - step: "Create default product usage for the line"
        action: "create"
        model: "product.usage_type"
        save_as: "usage_type"
        as_user: "base.user_admin"
        values:
          name: "Settlement Onchange Usage"
          code: "STOC1USG"

      - step: "Create expense type wired with both journals and the default usage"
        action: "create"
        model: "hr.expense_type"
        save_as: "expense_type"
        as_user: "base.user_admin"
        values:
          name: "Settlement Onchange Type"
          code: "STOC1TYPE"
          cash_advance_journal_id: "REC: ca_journal.id"
          cash_advance_account_id: "REC: cash_advance_account.id"
          cash_advance_payable_account_id: "REC: payable_account.id"
          cash_advance_settlement_journal_id: "REC: settlement_journal.id"
          default_product_usage_id: "REC: usage_type.id"

      - step: "Create an analytic account to prove the line reset"
        # No `as_user:` here (unlike the other fixtures in this scenario):
        # creating account.analytic.account requires the
        # analytic.group_analytic_accounting group, which base.user_admin
        # does not carry by default. Omitting `as_user:` runs this step
        # in the transaction's own (superuser) environment instead.
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic_account"
        values:
          name: "Settlement Onchange Analytic Account"

      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        as_user: "base.user_admin"
        values:
          name: "Settlement Onchange Employee"

      - step: "Create the underlying (draft) cash advance to settle"
        action: "create"
        model: "hr.cash_advance"
        save_as: "cash_advance"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          type_id: "REC: expense_type.id"
          journal_id: "REC: ca_journal.id"
          cash_advance_account_id: "REC: cash_advance_account.id"
          payable_account_id: "REC: payable_account.id"
          date: 2026-02-10
          date_due: 2026-03-10

      - step: "Create a product for the inline detail line"
        action: "create"
        model: "product.product"
        save_as: "product"
        as_user: "base.user_admin"
        values:
          name: "Settlement Onchange Product"
          type: "consu"

      - step: "Fill header with a pre-filled line, then toggle type_id"
        action: form
        model: "hr.cash_advance_settlement"
        save_as: "header"
        as_user: "base.user_admin"
        ops:
          - set: {employee_id: "REC: employee"}
          - set: {cash_advance_id: "REC: cash_advance"}
          - set: {date: 2026-02-15}
          - new:
              field: "line_ids"
              values:
                product_id: "REC: product"
                name: "Settlement Onchange Line"
                uom_id: "REC: product.uom_id"
                uom_quantity: 1
                price_unit: 10.0
                account_id: "REC: line_account"
                analytic_account_id: "REC: analytic_account"
          - set: {type_id: "REC: expense_type"}
          - assert:
              journal_id:
                type: "m2o"
                expected: "REC: settlement_journal"
              pricelist_id:
                type: "value"
                operator: "is_falsy"
          # `action: form` requires many2one values to be records, and the
          # Form API itself rejects a bare `False` for a many2one (it only
          # accepts a recordset). An empty recordset of the right model
          # clears the field the same way the UI would.
          - set: {type_id: "EVAL: env['hr.expense_type']"}
          - assert:
              journal_id:
                type: "value"
                operator: "is_falsy"
          # type_id is required to save the record -- set it back so the
          # form can be saved and the resulting line inspected below.
          - set: {type_id: "REC: expense_type"}
        save: true

      - step: "Assert line usage_id populated from type_id.default_product_usage_id"
        action: "assert"
        target: "header"
        refresh: true
        asserts:
          line_ids.usage_id:
            type: "m2o"
            expected: "REC: usage_type"

      - step:
          "Assert line analytic_account_id reset by onchange_line_analytic_account_id"
        action: "assert"
        target: "header"
        refresh: true
        asserts:
          line_ids.analytic_account_id:
            type: "value"
            operator: "is_falsy"
