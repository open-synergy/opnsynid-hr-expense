options:
  auto_refresh: true

setup:
  steps:
    - step: "Get the cash advance account"
      action: "ref"
      xml_id: "ssi_hr_cash_advance.demo_account2"
      save_as: "ca_account"

    - step: "Get the expense and payable account"
      action: "ref"
      xml_id: "ssi_hr_cash_advance.demo_account1"
      save_as: "ex_account"

    - step: "Create a product"
      action: "create"
      model: "product.product"
      save_as: "product"
      as_user: "base.user_admin"
      values:
        name: "Analytic Journal Product"
        type: "consu"

    - step: "Create home address partner for the employee"
      action: "create"
      model: "res.partner"
      save_as: "employee_partner"
      as_user: "base.user_admin"
      values:
        name: "Analytic Journal Employee Address"
        is_company: false

    - step: "Create employee with a home address"
      action: "create"
      model: "hr.employee"
      save_as: "employee"
      as_user: "base.user_admin"
      values:
        name: "Analytic Journal Employee"
        address_home_id: "REC: employee_partner.id"

    - step: "Create analytic account aa_a"
      # No `as_user:`: creating account.analytic.account needs a group
      # base.user_admin lacks, so run in the superuser environment.
      action: "create"
      model: "account.analytic.account"
      save_as: "aa_a"
      values:
        name: "Analytic Journal aa_a"

    - step: "Create analytic account aa_b"
      # No `as_user:`: creating account.analytic.account needs a group
      # base.user_admin lacks, so run in the superuser environment.
      action: "create"
      model: "account.analytic.account"
      save_as: "aa_b"
      values:
        name: "Analytic Journal aa_b"

scenarios:
  - name: "Disbursement -- one debit line per analytic account, balanced entry"
    steps:
      - step: "Create expense type 1"
        action: "create"
        model: "hr.expense_type"
        save_as: "expense_type"
        as_user: "base.user_admin"
        values:
          name: "Analytic Journal Type 1"
          code: "ANJT1"

      - step: "Create the cash advance"
        action: "create"
        model: "hr.cash_advance"
        save_as: "cash_advance"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          type_id: "REC: expense_type.id"
          journal_id: "REF: ssi_hr_cash_advance.demo_journal1"
          cash_advance_account_id: "REF: ssi_hr_cash_advance.demo_account2"
          payable_account_id: "REF: ssi_hr_cash_advance.demo_account1"
          date: 2026-02-01
          date_due: 2026-03-01
          line_ids:
            - - 0
              - 0
              - date_expense: 2026-02-01
                product_id: "REC: product.id"
                name: "Disbursement 0"
                account_id: "REF: ssi_hr_cash_advance.demo_account1"
                price_unit: 100.0
                uom_quantity: 1.0
                uom_id: "REC: product.uom_id.id"
                analytic_account_id: "REC: aa_a.id"
            - - 0
              - 0
              - date_expense: 2026-02-01
                product_id: "REC: product.id"
                name: "Disbursement 1"
                account_id: "REF: ssi_hr_cash_advance.demo_account1"
                price_unit: 50.0
                uom_quantity: 1.0
                uom_id: "REC: product.uom_id.id"
                analytic_account_id: "REC: aa_b.id"
            - - 0
              - 0
              - date_expense: 2026-02-01
                product_id: "REC: product.id"
                name: "Disbursement 2"
                account_id: "REF: ssi_hr_cash_advance.demo_account1"
                price_unit: 30.0
                uom_quantity: 1.0
                uom_id: "REC: product.uom_id.id"

      - step: "Confirm the cash advance"
        action: "call"
        target: "cash_advance"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Force a fresh read before opening (T-04)"
        action: "assert"
        target: "cash_advance"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Open the cash advance (posts the disbursement entry)"
        action: "call"
        target: "cash_advance"
        method: "action_open"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Debit line of aa_a"
        action: "search"
        model: "account.move.line"
        save_as: "line_a"
        domain:
          - ["move_id", "=", "REC: cash_advance.move_id.id"]
          - ["account_id", "=", "REC: ca_account.id"]
          - ["analytic_account_id", "=", "REC: aa_a.id"]
          - ["debit", ">", 0.0]
        expect_count: 1

      - step: "Debit of aa_a is 100"
        action: "assert"
        target: "line_a"
        refresh: true
        asserts:
          debit:
            type: "value"
            expected: 100.0

      - step: "Debit line of aa_b"
        action: "search"
        model: "account.move.line"
        save_as: "line_b"
        domain:
          - ["move_id", "=", "REC: cash_advance.move_id.id"]
          - ["account_id", "=", "REC: ca_account.id"]
          - ["analytic_account_id", "=", "REC: aa_b.id"]
          - ["debit", ">", 0.0]
        expect_count: 1

      - step: "Debit of aa_b is 50"
        action: "assert"
        target: "line_b"
        refresh: true
        asserts:
          debit:
            type: "value"
            expected: 50.0

      - step: "Debit line without analytic"
        action: "search"
        model: "account.move.line"
        save_as: "line_n"
        domain:
          - ["move_id", "=", "REC: cash_advance.move_id.id"]
          - ["account_id", "=", "REC: ca_account.id"]
          - ["analytic_account_id", "=", false]
          - ["debit", ">", 0.0]
        expect_count: 1

      - step: "Debit without analytic is 30"
        action: "assert"
        target: "line_n"
        refresh: true
        asserts:
          debit:
            type: "value"
            expected: 30.0

      - step: "Payable credit is the sum of the debit lines"
        action: "search"
        model: "account.move.line"
        save_as: "payable"
        domain:
          - ["move_id", "=", "REC: cash_advance.move_id.id"]
          - ["account_id", "=", "REC: ex_account.id"]
          - ["credit", "=", 180.0]
        expect_count: 1

      - step: "Analytic line exists for aa_a"
        action: "search"
        model: "account.analytic.line"
        save_as: "analytic_line_a"
        domain:
          - ["move_id.move_id", "=", "REC: cash_advance.move_id.id"]
          - ["account_id", "=", "REC: aa_a.id"]
        expect_count: 1

      - step: "Analytic line exists for aa_b"
        action: "search"
        model: "account.analytic.line"
        save_as: "analytic_line_b"
        domain:
          - ["move_id.move_id", "=", "REC: cash_advance.move_id.id"]
          - ["account_id", "=", "REC: aa_b.id"]
        expect_count: 1

  - name: "Disbursement -- single analytic account keeps one line and the m2o"
