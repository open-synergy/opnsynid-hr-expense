        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Credit line of aa_a"
        action: "search"
        model: "account.move.line"
        save_as: "credit_a"
        domain:
          - ["move_id", "=", "REC: settlement.move_id.id"]
          - ["account_id", "=", "REC: ca_account.id"]
          - ["analytic_account_id", "=", "REC: aa_a.id"]
          - ["credit", "=", 100.0]
        expect_count: 1

      - step: "Credit of aa_a is reconciled"
        action: "assert"
        target: "credit_a"
        refresh: true
