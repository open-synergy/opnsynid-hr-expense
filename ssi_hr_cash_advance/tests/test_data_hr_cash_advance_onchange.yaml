options:
  auto_refresh: true

scenarios:
  - name:
      "Onchange type_id cascades to journal/accounts/pricelist/line usage/line analytic"
    steps:
      - step: "Get payable account type (system data)"
        action: "ref"
        xml_id: "account.data_account_type_payable"
        save_as: "account_type_payable"

      - step: "Create cash advance account"
        action: "create"
        model: "account.account"
        save_as: "cash_advance_account"
        as_user: "base.user_admin"
        values:
          name: "Onchange CA Advance Account"
          code: "OCCADV1"
          user_type_id: "REC: account_type_payable.id"
          internal_type: "other"
          reconcile: true

      - step: "Create payable account"
        action: "create"
        model: "account.account"
        save_as: "payable_account"
        as_user: "base.user_admin"
        values:
          name: "Onchange CA Payable Account"
          code: "OCCPAY1"
          user_type_id: "REC: account_type_payable.id"
          internal_type: "other"
          reconcile: true

      - step: "Create cash advance journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        as_user: "base.user_admin"
        values:
          name: "Onchange CA Journal"
          code: "OCJ1"
          type: "general"

      - step: "Create default product usage for the line"
        action: "create"
        model: "product.usage_type"
        save_as: "usage_type"
        as_user: "base.user_admin"
        values:
          name: "Onchange CA Usage"
          code: "OCUSAGE1"

      - step: "Create expense type wired with journal/accounts/usage"
        action: "create"
        model: "hr.expense_type"
        save_as: "expense_type"
        as_user: "base.user_admin"
        values:
          name: "Onchange CA Type"
          code: "OCTYPE1"
          cash_advance_journal_id: "REC: journal.id"
          cash_advance_account_id: "REC: cash_advance_account.id"
          cash_advance_payable_account_id: "REC: payable_account.id"
          default_product_usage_id: "REC: usage_type.id"

      - step: "Create an analytic account to prove the line reset"
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic_account"
        as_user: "base.user_admin"
        values:
          name: "Onchange CA Analytic Account"

      - step: "Create a product for the inline detail line"
        action: "create"
        model: "product.product"
        save_as: "product"
        as_user: "base.user_admin"
        values:
          name: "Onchange CA Product"
          type: "consu"

      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        as_user: "base.user_admin"
        values:
          name: "Onchange CA Employee"

      - step: "Fill header with a pre-filled line, then toggle type_id"
        action: form
        model: "hr.cash_advance"
        save_as: "header"
        as_user: "base.user_admin"
        ops:
          - set: {employee_id: "REC: employee"}
          - set: {date: 2026-03-02}
          - set: {date_due: 2026-03-05}
          - new:
              field: "line_ids"
              values:
                product_id: "REC: product"
                name: "Onchange CA Line"
                uom_id: "REC: product.uom_id"
                uom_quantity: 1
                price_unit: 10.0
                account_id: "REC: cash_advance_account"
                analytic_account_id: "REC: analytic_account"
          - set: {type_id: "REC: expense_type"}
          - assert:
              journal_id:
                type: "m2o"
                expected: "REC: journal"
              cash_advance_account_id:
                type: "m2o"
                expected: "REC: cash_advance_account"
              payable_account_id:
                type: "m2o"
                expected: "REC: payable_account"
              pricelist_id:
                type: "value"
                operator: "is_falsy"
          - set: {type_id: false}
          - assert:
              journal_id:
                type: "value"
                operator: "is_falsy"
              cash_advance_account_id:
                type: "value"
                operator: "is_falsy"
              payable_account_id:
                type: "value"
                operator: "is_falsy"
          # type_id is required to save the record -- set it back so the
          # form can be saved and the resulting line inspected below.
          - set: {type_id: "REC: expense_type"}
        save: true

      - step: "Assert line usage_id populated from type_id.default_product_usage_id"
        action: "assert"
        target: "header"
        refresh: true
        asserts:
          line_ids.usage_id:
            type: "m2o"
            expected: "REC: usage_type"

      - step:
          "Assert line analytic_account_id reset by onchange_line_analytic_account_id"
        action: "assert"
        target: "header"
        refresh: true
        asserts:
          line_ids.analytic_account_id:
            type: "value"
            operator: "is_falsy"

  - name: "Onchange date_due follows duration_id.get_duration(date)"
    steps:
      - step: "Create a 30-day duration"
        action: "create"
        model: "base.duration"
        save_as: "duration"
        as_user: "base.user_admin"
        values:
          name: "Onchange CA Duration 30 Days"
          code: "OCDUR30"
          relative_delta_days: 30

      - step: "Set date, assert date_due still empty (no duration yet)"
        action: form
        model: "hr.cash_advance"
        save: false
        as_user: "base.user_admin"
        ops:
          - set: {date: 2026-04-10}
          - assert:
              date_due:
                type: "value"
                operator: "is_falsy"
          - set: {duration_id: "REC: duration"}
          - assert:
              date_due:
                type: "value"
                expected: 2026-05-10
          - set: {date: 2026-04-20}
          - assert:
              date_due:
                type: "value"
                expected: 2026-05-20
