options:
  auto_refresh: true

scenarios:
  - name:
      "Action Open -- confirm then action_open transitions to Open and posts accounting
      entry"
    steps:
      - step: "Get payable account type (system data)"
        action: "ref"
        xml_id: "account.data_account_type_payable"
        save_as: "account_type_payable"

      - step: "Create cash advance account"
        action: "create"
        model: "account.account"
        save_as: "cash_advance_account"
        as_user: "base.user_admin"
        values:
          name: "Action Open CA Advance Account"
          code: "ACOP1ADV"
          user_type_id: "REC: account_type_payable.id"
          internal_type: "other"
          reconcile: true

      - step: "Create payable account"
        action: "create"
        model: "account.account"
        save_as: "payable_account"
        as_user: "base.user_admin"
        values:
          name: "Action Open CA Payable Account"
          code: "ACOP1PAY"
          user_type_id: "REC: account_type_payable.id"
          internal_type: "other"
          reconcile: true

      - step: "Create cash advance journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        as_user: "base.user_admin"
        values:
          name: "Action Open CA Journal"
          code: "AOJ1"
          type: "general"

      - step: "Create expense type"
        action: "create"
        model: "hr.expense_type"
        save_as: "expense_type"
        as_user: "base.user_admin"
        values:
          name: "Action Open CA Type"
          code: "ACOP1TYPE"

      - step: "Create home address partner for the employee"
        action: "create"
        model: "res.partner"
        save_as: "employee_partner"
        as_user: "base.user_admin"
        values:
          name: "Action Open Employee Address"
          is_company: false

      - step:
          "Create employee with a home address (required by _get_partner_id on open)"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        as_user: "base.user_admin"
        values:
          name: "Action Open Employee"
          address_home_id: "REC: employee_partner.id"

      - step: "Create draft cash advance"
        action: "create"
        model: "hr.cash_advance"
        save_as: "cash_advance"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          type_id: "REC: expense_type.id"
          journal_id: "REC: journal.id"
          cash_advance_account_id: "REC: cash_advance_account.id"
          payable_account_id: "REC: payable_account.id"
          date: 2026-02-01
          date_due: 2026-03-01

      - step: "Assert created in draft"
        action: "assert"
        target: "cash_advance"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm cash advance (prerequisite for Open)"
        action: "call"
        target: "cash_advance"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Force a fresh read before calling action_open directly (T-04)"
        action: "assert"
        target: "cash_advance"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step:
          "Call action_open directly: transitions to Open and creates the journal entry"
        action: "call"
        target: "cash_advance"
        method: "action_open"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert accounting entry linked and not yet realized/settled"
        action: "assert"
        target: "cash_advance"
        refresh: true
        asserts:
          move_id:
            type: "value"
            operator: "is_truthy"
          payable_move_line_id:
            type: "value"
            operator: "is_truthy"
          cash_advance_move_line_id:
            type: "value"
            operator: "is_truthy"
          realized:
            type: "value"
            expected: false
          settled:
            type: "value"
            expected: false

  - name:
      "Action Cancel -- draft cash advance cancelled through the select-reason wizard
      (exercises action_cancel)"
    steps:
      - step: "Create draft cash advance to cancel"
        action: "create"
        model: "hr.expense_type"
        save_as: "expense_type_cancel"
        as_user: "base.user_admin"
        values:
          name: "Action Cancel CA Type"
          code: "ACCN1TYPE"

      - step: "Create employee for the cancel fixture"
        action: "create"
        model: "hr.employee"
        save_as: "employee_cancel"
        as_user: "base.user_admin"
        values:
          name: "Action Cancel Employee"

      - step: "Get payable account type (system data)"
        action: "ref"
        xml_id: "account.data_account_type_payable"
        save_as: "account_type_payable_cancel"

      - step: "Create cash advance account for the cancel fixture"
        action: "create"
        model: "account.account"
        save_as: "cash_advance_account_cancel"
        as_user: "base.user_admin"
        values:
          name: "Action Cancel CA Advance Account"
          code: "ACCN1ADV"
          user_type_id: "REC: account_type_payable_cancel.id"
          internal_type: "other"
          reconcile: true

      - step: "Create payable account for the cancel fixture"
        action: "create"
        model: "account.account"
        save_as: "payable_account_cancel"
        as_user: "base.user_admin"
        values:
          name: "Action Cancel CA Payable Account"
          code: "ACCN1PAY"
          user_type_id: "REC: account_type_payable_cancel.id"
          internal_type: "other"
          reconcile: true

      - step: "Create journal for the cancel fixture"
        action: "create"
        model: "account.journal"
        save_as: "journal_cancel"
        as_user: "base.user_admin"
        values:
          name: "Action Cancel CA Journal"
          code: "ACJ1"
          type: "general"

      - step:
          "Create draft cash advance (no move yet, so cancel needs no accounting
          cleanup)"
        action: "create"
        model: "hr.cash_advance"
        save_as: "cash_advance_cancel"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee_cancel.id"
          type_id: "REC: expense_type_cancel.id"
          journal_id: "REC: journal_cancel.id"
          cash_advance_account_id: "REC: cash_advance_account_cancel.id"
          payable_account_id: "REC: payable_account_cancel.id"
          date: 2026-02-01
          date_due: 2026-03-01

      - step: "Create a global cancel reason"
        action: "create"
        model: "base.cancel_reason"
        save_as: "cancel_reason"
        as_user: "base.user_admin"
        values:
          name: "Action Cancel CA Reason"
          code: "ACCN1REASON"
          global_use: true

      - step: "Cancel via select-reason wizard (exercises action_cancel)"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "cash_advance_cancel"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: cancel_reason"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"

  - name:
      "Action Recompute Realization -- no-op, then Open<->Done as realized/settled flip"
    steps:
      - step: "Get payable account type (system data)"
        action: "ref"
        xml_id: "account.data_account_type_payable"
        save_as: "account_type_payable_recompute"

      - step: "Create cash advance account for the recompute fixture"
        action: "create"
        model: "account.account"
        save_as: "cash_advance_account_recompute"
        as_user: "base.user_admin"
        values:
          name: "Action Recompute CA Advance Account"
          code: "ACRC1ADV"
          user_type_id: "REC: account_type_payable_recompute.id"
          internal_type: "other"
          reconcile: true

      - step: "Create payable account for the recompute fixture"
        action: "create"
        model: "account.account"
        save_as: "payable_account_recompute"
        as_user: "base.user_admin"
        values:
          name: "Action Recompute CA Payable Account"
          code: "ACRC1PAY"
          user_type_id: "REC: account_type_payable_recompute.id"
          internal_type: "other"
          reconcile: true

      - step: "Create journal for the recompute fixture"
        action: "create"
        model: "account.journal"
        save_as: "journal_recompute"
        as_user: "base.user_admin"
        values:
          name: "Action Recompute CA Journal"
          code: "ARJ1"
          type: "general"

      - step: "Create expense type for the recompute fixture"
        action: "create"
        model: "hr.expense_type"
        save_as: "expense_type_recompute"
        as_user: "base.user_admin"
        values:
          name: "Action Recompute CA Type"
          code: "ACRC1TYPE"

      - step: "Create home address partner"
        action: "create"
        model: "res.partner"
        save_as: "employee_partner_recompute"
        as_user: "base.user_admin"
        values:
          name: "Action Recompute Employee Address"
          is_company: false

      - step: "Create employee with a home address"
        action: "create"
        model: "hr.employee"
        save_as: "employee_recompute"
        as_user: "base.user_admin"
        values:
          name: "Action Recompute Employee"
          address_home_id: "REC: employee_partner_recompute.id"

      - step: "Create, confirm and open the cash advance"
        action: "create"
        model: "hr.cash_advance"
        save_as: "cash_advance_recompute"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee_recompute.id"
          type_id: "REC: expense_type_recompute.id"
          journal_id: "REC: journal_recompute.id"
          cash_advance_account_id: "REC: cash_advance_account_recompute.id"
          payable_account_id: "REC: payable_account_recompute.id"
          date: 2026-02-01
          date_due: 2026-03-01

      - step: "Confirm"
        action: "call"
        target: "cash_advance_recompute"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Force a fresh read before opening (T-04)"
        action: "assert"
        target: "cash_advance_recompute"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Open (creates the accounting entry, not yet realized/settled)"
        action: "call"
        target: "cash_advance_recompute"
        method: "action_open"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "action_recompute_realization is a no-op while not realized nor settled"
        action: "call"
        target: "cash_advance_recompute"
        method: "action_recompute_realization"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step:
          "Simulate full reconciliation by writing the stored realized/settled flags"
        action: "write"
        target: "cash_advance_recompute"
        as_user: "base.user_admin"
        values:
          realized: true
          settled: true

      - step:
          "action_recompute_realization moves a realized+settled Open document to Done"
        action: "call"
        target: "cash_advance_recompute"
        method: "action_recompute_realization"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Simulate the payable line becoming unreconciled again"
        action: "write"
        target: "cash_advance_recompute"
        as_user: "base.user_admin"
        values:
          realized: false

      - step:
          "action_recompute_realization reopens a Done document that is no longer fully
          realized"
        action: "call"
        target: "cash_advance_recompute"
        method: "action_recompute_realization"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
