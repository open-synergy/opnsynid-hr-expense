options:
  auto_refresh: true

scenarios:
  - name: "Onchange line usage_id follows the header type's default product usage"
    steps:
      - step: "Get payable account type (system data)"
        action: "ref"
        xml_id: "account.data_account_type_payable"
        save_as: "account_type_payable"

      - step: "Create cash advance account"
        action: "create"
        model: "account.account"
        save_as: "cash_advance_account"
        as_user: "base.user_admin"
        values:
          name: "Line Onchange CA Advance Account"
          code: "LNOC1ADV"
          user_type_id: "REC: account_type_payable.id"
          internal_type: "other"
          reconcile: true

      - step: "Create payable account"
        action: "create"
        model: "account.account"
        save_as: "payable_account"
        as_user: "base.user_admin"
        values:
          name: "Line Onchange CA Payable Account"
          code: "LNOC1PAY"
          user_type_id: "REC: account_type_payable.id"
          internal_type: "other"
          reconcile: true

      - step: "Create journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        as_user: "base.user_admin"
        values:
          name: "Line Onchange CA Journal"
          code: "LOJ1"
          type: "general"

      - step: "Create default product usage"
        action: "create"
        model: "product.usage_type"
        save_as: "usage_type"
        as_user: "base.user_admin"
        values:
          name: "Line Onchange CA Usage"
          code: "LNOC1USG"

      - step: "Create expense type wired with the default product usage"
        action: "create"
        model: "hr.expense_type"
        save_as: "expense_type"
        as_user: "base.user_admin"
        values:
          name: "Line Onchange CA Type"
          code: "LNOC1TYPE"
          default_product_usage_id: "REC: usage_type.id"

      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        as_user: "base.user_admin"
        values:
          name: "Line Onchange Employee"

      - step: "Create the header cash advance the line will belong to"
        action: "create"
        model: "hr.cash_advance"
        save_as: "header"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          type_id: "REC: expense_type.id"
          journal_id: "REC: journal.id"
          cash_advance_account_id: "REC: cash_advance_account.id"
          payable_account_id: "REC: payable_account.id"
          date: 2026-02-05
          date_due: 2026-03-05

      - step: "Create a product for the line"
        action: "create"
        model: "product.product"
        save_as: "product"
        as_user: "base.user_admin"
        values:
          name: "Line Onchange Product"
          type: "consu"

      - step: "Set product_id, assert usage_id follows the header type's default usage"
        action: form
        model: "hr.cash_advance_line"
        save: false
        as_user: "base.user_admin"
        ops:
          - set: {cash_advance_id: "REC: header"}
          - set: {name: "Line Onchange Detail"}
          - set: {product_id: "REC: product"}
          - assert:
              usage_id:
                type: "m2o"
                expected: "REC: usage_type"
          # `action: form` requires many2one values to be records, and the
          # Form API itself rejects a bare `False` for a many2one (it only
          # accepts a recordset). An empty recordset of the right model
          # clears the field the same way the UI would.
          - set: {product_id: "EVAL: env['product.product']"}
          - assert:
              usage_id:
                type: "value"
                operator: "is_falsy"

  - name: "Onchange pricelist_id override leaves the header-derived pricelist untouched"
    steps:
      - step: "Get the public pricelist (system data)"
        action: "ref"
        xml_id: "product.list0"
        save_as: "pricelist"

      - step: "Get payable account type (system data)"
        action: "ref"
        xml_id: "account.data_account_type_payable"
        save_as: "account_type_payable_pl"

      - step: "Create cash advance account"
        action: "create"
        model: "account.account"
        save_as: "cash_advance_account_pl"
        as_user: "base.user_admin"
        values:
          name: "Line Onchange PL Advance Account"
          code: "LNOC2ADV"
          user_type_id: "REC: account_type_payable_pl.id"
          internal_type: "other"
          reconcile: true

      - step: "Create payable account"
        action: "create"
        model: "account.account"
        save_as: "payable_account_pl"
        as_user: "base.user_admin"
        values:
          name: "Line Onchange PL Payable Account"
          code: "LNOC2PAY"
          user_type_id: "REC: account_type_payable_pl.id"
          internal_type: "other"
          reconcile: true

      - step: "Create journal"
        action: "create"
        model: "account.journal"
        save_as: "journal_pl"
        as_user: "base.user_admin"
        values:
          name: "Line Onchange PL Journal"
          code: "LOJ2"
          type: "general"

      - step: "Create expense type"
        action: "create"
        model: "hr.expense_type"
        save_as: "expense_type_pl"
        as_user: "base.user_admin"
        values:
          name: "Line Onchange PL Type"
          code: "LNOC2TYPE"

      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee_pl"
        as_user: "base.user_admin"
        values:
          name: "Line Onchange PL Employee"

      - step: "Create the header with a pricelist already set"
        action: "create"
        model: "hr.cash_advance"
        save_as: "header_pl"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee_pl.id"
          type_id: "REC: expense_type_pl.id"
          journal_id: "REC: journal_pl.id"
          cash_advance_account_id: "REC: cash_advance_account_pl.id"
          payable_account_id: "REC: payable_account_pl.id"
          pricelist_id: "REC: pricelist.id"
          date: 2026-02-05
          date_due: 2026-03-05

      - step: "Assert the related pricelist_id is inherited from the header"
        action: form
        model: "hr.cash_advance_line"
        save: false
        as_user: "base.user_admin"
        ops:
          - set: {cash_advance_id: "REC: header_pl"}
          - assert:
              pricelist_id:
                type: "m2o"
                expected: "REC: pricelist"
          # onchange_pricelist_id is overridden to a no-op on this model
          # (the related field already tracks the header), so changing
          # its trigger fields (currency_id) must leave pricelist_id
          # untouched -- unlike the base mixin, which would reset it.
          # `action: form` requires many2one values to be records --
          # `REC:`/`RECORDSET:`, never `REF:` (which resolves to an id).
          - set: {currency_id: "RECORDSET: base.USD"}
          - assert:
              pricelist_id:
                type: "m2o"
                expected: "REC: pricelist"
